site_name: Mastering Earth Observation Application Packaging with CWL

theme:
    logo: imgs/icon-eoap.png
    name: material
    features:
      - navigation.tabs
      - navigation.tabs.sticky
      - content.code.copy

    palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/toggle-switch-off-outline
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/toggle-switch
        name: Switch to light mode
plugins:
  - search
  - mermaid2:
      version: 10.6.0
  - glightbox:
      # The alt text of the image becomes the caption under the enlarged version.
      auto_caption: true
      caption_position: bottom
      # Scroll-to-zoom and drag inside the modal: a full-width UI capture is only
      # readable once the reader can get close to a single panel.
      zoomable: true
      draggable: true
      # Never wrap these: a Mermaid diagram is an SVG the reader can already
      # read at page size, and the modal would swallow its links.
      skip_classes:
        - mermaid

markdown_extensions:
  - toc:
      permalink: true
  - abbr
  - admonition
  - footnotes
  - tables
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.caret
  - pymdownx.mark
  - pymdownx.tilde
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.inlinehilite
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
  - pymdownx.snippets:
      base_path: './'
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_div_format
extra_css:
  - stylesheets/extra.css
extra_javascript:
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js


