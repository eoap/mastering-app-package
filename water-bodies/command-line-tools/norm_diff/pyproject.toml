[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "norm_diff"
dynamic = ["version"]
description = "Calculate normalized difference from two rasters"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
keywords = []
authors = [
  { name = "Fabrice Brito", email = "info@terradue.com" },
  { name = "Simone Tripodi", email = "info@terradue.com" },
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: Implementation :: CPython",
  "Programming Language :: Python :: Implementation :: PyPy",
]
dependencies = [
  "click>=8.1.3",
  "rasterio==1.4.4",
  "numpy>=1.24",
  "loguru>=0.7.3",
]

[project.urls]
Documentation = "https://github.com/eoap/mastering-app-package/blob/main/water-bodies/command-line-tools/norm_diff/README.md"
Issues = "https://github.com/eoap/mastering-app-package/issues"
Source = "https://github.com/eoap/mastering-app-package"

[tool.hatch.version]
path = "src/norm_diff/__about__.py"

[tool.hatch.envs.types]
extra-dependencies = [
  "mypy==1.19.1",
]

[project.scripts]
norm_diff = "norm_diff.cli:norm_diff"

[tool.hatch.envs.types.scripts]
check = "mypy --install-types --non-interactive {args:src/norm_diff tests}"

[tool.coverage.run]
source_pkgs = ["norm_diff", "tests"]
branch = true
parallel = true
omit = [
  "src/norm_diff/__about__.py",
]

[tool.coverage.paths]
norm_diff = ["src/norm_diff", "*/norm_diff/src/norm_diff"]
tests = ["tests", "*/norm_diff/tests"]

[tool.coverage.report]
exclude_lines = [
  "no cov",
  "if __name__ == .__main__.:",
  "if TYPE_CHECKING:",
]

[tool.hatch.envs.test]
skip-install = false
dependencies = [
  "pytest>=8.4,<10",
  "pytest-cov>=6.2,<8",
]

[tool.hatch.envs.test.scripts]
test = "pytest {args:tests}"
testv = "pytest --verbose {args:tests}"
test-cov = "pytest --cov=norm_diff --cov-report=term-missing {args:tests}"
test-show-setup = "pytest --setup-show"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
  "--strict-config",
  "--strict-markers",
]

[[tool.hatch.envs.test.matrix]]
python = ["3.10", "3.11", "3.12", "3.13", "3.14"]

[tool.hatch.envs.default]
skip-install = false
extra-dependencies = [
  "bash-kernel>=0.10,<1",
]

[tool.hatch.envs.dev]
skip-install = false
dependencies = [
  "pytest>=8.4,<10",
  "mypy>=2.3.0",
  "ruff>=0.16.0",
  "bandit>=1.9.4",
]

[tool.ruff]
# Generated by cwl2click; regenerate rather than hand-edit this file.
extend-exclude = ["src/norm_diff/cli.py"]

[tool.ruff.lint]
select = [
  "F",    # Pyflakes
  "E",    # pycodestyle errors
  "W",    # pycodestyle warnings
  "I",    # isort
  "UP",   # pyupgrade
  "B",    # flake8-bugbear
  "C4",   # flake8-comprehensions
  "SIM",  # flake8-simplify
  "FA",   # flake8-future-annotations
  "TC",   # flake8-type-checking
  "PTH",  # flake8-use-pathlib
  "RET",  # flake8-return
  "C90",  # McCabe complexity
]
ignore = [
  "E501", # Line length handled by formatter
  "W191", # Indentation handled by formatter
  "E111",
  "E114",
  "E117",
]

[tool.ruff.lint.mccabe]
max-complexity = 4

[tool.hatch.envs.dev.scripts]
typecheck = "mypy --install-types --non-interactive {args:src tests}"
lint = "ruff format {args:src tests}"
check = "ruff check --fix {args:src tests}"
security = "bandit -r {args:src}"
