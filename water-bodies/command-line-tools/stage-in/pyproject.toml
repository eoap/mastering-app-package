[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "stage"
dynamic = ["version"]
description = "Stage STAC items and assets into a local catalog"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "CC-BY-SA-4.0"
keywords = []
classifiers = ["Development Status :: 4 - Beta", "Programming Language :: Python", "Programming Language :: Python :: 3.12", "Programming Language :: Python :: Implementation :: CPython", "Programming Language :: Python :: Implementation :: PyPy"]
dependencies = ["stac-asset==0.4.7", "click==8.5.0", "pystac==1.15.2", "boto3==1.40.18", "loguru==0.7.3"]

[[project.authors]]
name = "Fabrice Brito"
email = "info@terradue.com"

[[project.authors]]
name = "Simone Tripodi"
email = "info@terradue.com"

[project.scripts]
stage-in = "stage.stage_in_cli:stage_in"

[project.urls]
Documentation = "https://github.com/eoap/mastering-app-package/blob/main/water-bodies/command-line-tools/stage-in/README.md"
Issues = "https://github.com/eoap/mastering-app-package/issues"
Source = "https://github.com/eoap/mastering-app-package"

[tool.hatch.version]
path = "src/stage/__about__.py"

[tool.hatch.envs.types]
extra-dependencies = ["mypy==1.19.1"]

[tool.hatch.envs.types.scripts]
check = "mypy --install-types --non-interactive {args:src/stage tests}"

[tool.hatch.envs.test]
template = "dev"

[tool.hatch.envs.test.scripts]
test = ["bootstrap", "pytest -q {args}"]

[tool.hatch.envs.default]
template = "dev"
skip-install = false
pre-install-commands = ["uv pip install --require-hashes -r requirements/development.txt"]
post-install-commands = ["uv pip install --no-deps --no-build-isolation -e ."]

[tool.hatch.envs.dev]
skip-install = true
installer = "uv"
post-install-commands = ["uv pip install --require-hashes -r requirements/development.txt", "uv pip install --no-deps --no-build-isolation -e ."]
template = "dev"

[tool.hatch.envs.dev.scripts]
check = ["bootstrap", "format-check", "lint-check", "typecheck", "security"]
format-check = "ruff format --check src tests"
lint-check = "ruff check src tests"
typecheck = "mypy src"
security = "bandit -r src -ll"
bootstrap = ["uv pip install --require-hashes -r requirements/development.txt", "uv pip install --no-deps --no-build-isolation -e ."]

[tool.hatch.build.targets.wheel]
packages = ["src/stage"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/requirements", "/README.md", "/LICENSE.md", "/pyproject.toml", "/Dockerfile"]

[tool.coverage.run]
source_pkgs = ["stage", "tests"]
branch = true
parallel = true
omit = ["src/stage/__about__.py"]

[tool.coverage.paths]
stage = ["src/stage", "*/stage/src/stage"]
tests = ["tests", "*/stage/tests"]

[tool.coverage.report]
exclude_lines = ["no cov", "if __name__ == .__main__.:", "if TYPE_CHECKING:"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "C4", "SIM", "C90"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.mypy]
ignore_missing_imports = true
strict = true
