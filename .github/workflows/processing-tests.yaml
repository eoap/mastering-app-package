name: Processing packages
on:
  workflow_call:
  pull_request:
    paths:
      - 'water-bodies/command-line-tools/**'
      - 'cwl-cli/**'
      - 'cwl-workflow/**'
      - 'tests/**'
      - 'scripts/*cwl-release*'
      - 'scripts/check-oci-annotations.py'
      - 'scripts/prepare-kubernetes-lab.sh'
      - '.github/workflows/build.yaml'
      - '.github/workflows/processing-tests.yaml'
  push:
    branches: [main, master]
    paths:
      - 'water-bodies/command-line-tools/**'
      - 'cwl-cli/**'
      - 'cwl-workflow/**'
      - 'tests/**'
      - 'scripts/*cwl-release*'
      - 'scripts/check-oci-annotations.py'
      - 'scripts/prepare-kubernetes-lab.sh'
      - '.github/workflows/build.yaml'
      - '.github/workflows/processing-tests.yaml'
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Bootstrap patched pip and CA bundle
        shell: bash
        run: |
          python -m pip install --upgrade "pip @ https://files.pythonhosted.org/packages/3f/06/3e4420302363fbb71be3c7f35ce042f54bfca330e3e66b3a2e3c4cca579f/pip-26.2.2-py3-none-any.whl#sha256=fd7f4dfa8190e014013b9f08f3e973f4e4c26ffd179a204895533a7254813a70"
          python -m pip install --upgrade "certifi>=2026.10.19"
          python -c "import pip, certifi; from pip._vendor import certifi as bundled; assert tuple(map(int, pip.__version__.split('.'))) >= (26, 2, 2); assert tuple(map(int, certifi.__version__.split('.'))) >= (2026, 10, 19); assert tuple(map(int, bundled.__version__.split('.'))) >= (2026, 10, 19)"
          python -m pip download --no-deps --dest "$RUNNER_TEMP/python-bootstrap" "pip @ https://files.pythonhosted.org/packages/3f/06/3e4420302363fbb71be3c7f35ce042f54bfca330e3e66b3a2e3c4cca579f/pip-26.2.2-py3-none-any.whl#sha256=fd7f4dfa8190e014013b9f08f3e973f4e4c26ffd179a204895533a7254813a70"
          echo "VIRTUALENV_EXTRA_SEARCH_DIR=$RUNNER_TEMP/python-bootstrap" >> "$GITHUB_ENV"
          echo "VIRTUALENV_PIP=26.2.2" >> "$GITHUB_ENV"
          echo "VIRTUALENV_DOWNLOAD=false" >> "$GITHUB_ENV"
      - name: Install packages and test tools
        run: |
          python -m pip install pytest build cwltool \
            ./water-bodies/command-line-tools/crop \
            ./water-bodies/command-line-tools/norm_diff \
            ./water-bodies/command-line-tools/otsu \
            ./water-bodies/command-line-tools/stac \
            ./water-bodies/command-line-tools/stage-in \
            ./water-bodies/command-line-tools/stage-out
      - name: Test commands and processing chain
        run: pytest --import-mode=importlib tests water-bodies/command-line-tools/{crop,norm_diff,otsu,stac,stage-in,stage-out}/tests
      - name: Validate CWL and build wheels and images
        run: |
          while IFS= read -r cwl; do cwltool --validate "$cwl"; done < <(git ls-files '*.cwl')
          for package in crop norm_diff otsu stac stage-in stage-out; do
            python -m build --wheel --outdir /tmp/wheels "water-bodies/command-line-tools/$package"
            docker build --pull --no-cache -t "processing-$package:test" "water-bodies/command-line-tools/$package"
            docker run --rm "processing-$package:test" "$package" --help
          done
