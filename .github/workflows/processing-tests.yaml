name: Processing packages
on:
  workflow_call:
  pull_request:
    paths:
      - 'water-bodies/command-line-tools/**'
      - 'cwl-cli/**'
      - 'cwl-workflow/**'
      - 'tests/**'
      - 'scripts/*cwl-release*'
      - 'scripts/check-oci-annotations.py'
      - 'scripts/prepare-kubernetes-lab.sh'
      - '.github/workflows/build.yaml'
      - '.github/workflows/processing-tests.yaml'
  push:
    branches: [main, master]
    paths:
      - 'water-bodies/command-line-tools/**'
      - 'cwl-cli/**'
      - 'cwl-workflow/**'
      - 'tests/**'
      - 'scripts/*cwl-release*'
      - 'scripts/check-oci-annotations.py'
      - 'scripts/prepare-kubernetes-lab.sh'
      - '.github/workflows/build.yaml'
      - '.github/workflows/processing-tests.yaml'
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v6
      - name: Install locked package environments and run quality gates
        shell: bash
        run: |
          set -euo pipefail
          for package in crop norm_diff otsu stac stage-in stage-out; do
            package_dir="$PWD/water-bodies/command-line-tools/$package"
            uv venv "$package_dir/.venv" --python 3.12
            uv pip install --python "$package_dir/.venv/bin/python" --require-hashes -r "$package_dir/requirements/development.txt"
            uv pip install --python "$package_dir/.venv/bin/python" --no-deps --no-build-isolation -e "$package_dir"
            (
              cd "$package_dir"
              .venv/bin/ruff format --check src tests
              .venv/bin/ruff check src tests
              .venv/bin/mypy src
              .venv/bin/bandit -r src -ll
              .venv/bin/pytest -q
            )
            echo "$package_dir/.venv/bin" >> "$GITHUB_PATH"
          done
      - name: Test processing chain and release metadata
        run: pytest --import-mode=importlib tests
      - name: Validate CWL and build wheels and images
        run: |
          uv tool run --from cwltool==3.1.20260315121657 cwltool --version
          while IFS= read -r cwl; do uv tool run --from cwltool==3.1.20260315121657 cwltool --validate "$cwl"; done < <(git ls-files '*.cwl')
          for package in crop norm_diff otsu stac stage-in stage-out; do
            (cd "water-bodies/command-line-tools/$package" && .venv/bin/hatch build -t wheel)
            docker build -t "processing-$package:test" "water-bodies/command-line-tools/$package"
            docker run --rm "processing-$package:test" "$package" --help
          done
